      - generic [ref=e180]:
        - generic [ref=e181]:
          - heading [level=3] [ref=e182]:
            - button "Is the session tailored to my specific job interview?" [expanded] [ref=e183]
          - region "Is the session tailored to my specific job interview?" [ref=e187]:
            - paragraph [ref=e191]: Yes. When you have a job description or interview invitation, share it with us together with your CV. We use that context to focus the preparation on the role, likely requirements and your relevant experience.
        - generic [ref=e192]:
          - heading [level=3] [ref=e193]:
            - button "What should I send before the session?" [ref=e194]
          - region "What should I send before the session?":
            - paragraph [ref=e200]: Please send your current CV, the job description and any information the employer has provided about the interview format. You can also tell us which questions or parts of the interview concern you most.
        - generic [ref=e201]:
          - heading [level=3] [ref=e202]:
            - button "Can you help me prepare if I do not have a specific interview yet?" [ref=e203]
          - region "Can you help me prepare if I do not have a specific interview yet?":
            - paragraph [ref=e209]: Yes. We can focus on the types of roles you are targeting, common interview formats and the career stories you should be ready to discuss. Role-specific information simply allows us to make the practice more precise.
        - generic [ref=e210]:
          - heading [level=3] [ref=e211]:
            - button "Does interview preparation include a mock interview?" [ref=e212]
          - region "Does interview preparation include a mock interview?":
            - paragraph [ref=e218]: The session can include realistic question practice and mock-interview elements. The exact balance between coaching, practice and feedback depends on your needs and the interview you are preparing for.
        - generic [ref=e219]:
          - heading [level=3] [ref=e220]:
            - button "Can you prepare me for a virtual interview?" [ref=e221]
          - region "Can you prepare me for a virtual interview?":
            - paragraph [ref=e227]: Yes. Preparation can cover both your answers and the practical details that affect virtual interviews, including camera positioning, audio, environment, eye contact and communication pace.
        - generic [ref=e228]:
          - heading [level=3] [ref=e229]:
            - button "How far in advance should I book?" [ref=e230]
          - region "How far in advance should I book?":
            - paragraph [ref=e236]: Book as early as you can so there is time to practise after receiving feedback. If your interview is approaching quickly, include the date in your enquiry so our team can advise you on availability.
