        - heading "Turn Interview Anxiety Into a Clear Plan" [level=2] [ref=e78]
        - paragraph [ref=e79]: Good preparation is not about memorising perfect answers. It is about understanding what employers need, selecting relevant evidence and communicating it naturally.
      - generic [ref=e80]:
        - article [ref=e81]:
          - heading "Build Genuine Confidence" [level=3] [ref=e86]
          - paragraph [ref=e87]: Rehearse in a supportive setting so the interview format, common questions and your strongest examples feel familiar before the real conversation.
        - article [ref=e88]:
          - heading "Strengthen Your Answers" [level=3] [ref=e93]
          - paragraph [ref=e94]: Learn how to organise answers clearly, use relevant evidence and avoid responses that are vague, overly long or disconnected from the role.
        - article [ref=e95]:
          - heading "Present Your Experience Well" [level=3] [ref=e99]
          - paragraph [ref=e100]: Identify the achievements, skills and career stories that best demonstrate the value you can bring to a prospective employer.
        - article [ref=e101]:
          - heading "Handle Difficult Moments" [level=3] [ref=e107]
          - paragraph [ref=e108]: Prepare for career gaps, salary discussions, role changes, limited experience and other questions that can be difficult to answer without a plan.
